# the-i18n-kit — GitLab CI template. Three jobs to `extends:`:
#
#   .i18n-translate  translate the missing keys, commit and push them
#   .i18n-cleanup    report orphan keys as a Code Quality report
#   .i18n-check      report keys that render as their raw key
#
# Include it at a `v<major>` ref, which moves with each CLI release of that
# major; `main` can change ahead of the CLI a pinned project installs.
#
# Each takes its outcome from the CLI's exit code: 0 pass, 1 the run failed, 2 a
# gate tripped. Variables, the `lint` stage, the default-branch rule the Code
# Quality widget needs and the two ways to let the translate job push:
# https://fabkho.github.io/the-i18n-kit/ci-cd/gitlab-ci

# ─── Image and install, shared by every job. Scripts are POSIX sh: dash aborts
# a job before running a line on a bash-ism. ─────────────────────────────────
.i18n-base:
  image: node:22-alpine
  stage: lint
  variables:
    I18N_CLI_VERSION: "8"        # x-release-please-major — the CLI major this template was written for
    I18N_INSTALL_PEER_DEPS: ""   # extra npm packages to install globally alongside the CLI
  # `|| exit 1`: allow_failure.exit_codes covers before_script too, so an
  # installer that happened to exit 2 would pass the job yellow, unscanned.
  before_script:
    - if command -v apk >/dev/null; then apk add --no-cache git curl || exit 1; fi
    - npm install -g --legacy-peer-deps "@the-i18n-kit/cli@${I18N_CLI_VERSION}" $I18N_INSTALL_PEER_DEPS || exit 1

# ─── Translate missing keys, then commit and push them ──────────────────────
.i18n-translate:
  extends: .i18n-base
  allow_failure: true
  variables:
    I18N_LAYER: ""            # layer to translate (empty = every locale-backed layer, one commit)
    I18N_LOCALES: ""          # comma-separated target locales (default: all except the reference)
    I18N_SOURCE_LOCALE: ""    # reference locale (default: from .i18n-mcp.json)
    I18N_KEYS: ""             # comma-separated keys (default: all missing)
    I18N_BATCH_SIZE: "50"     # keys per LLM call
    I18N_DRY_RUN: "false"     # "true" previews without writing or committing
    I18N_FAIL_ON_FAILED: ""   # "true" exits 2 when any key failed to translate
    I18N_LOCALE_PATHS: "i18n/locales/"  # space-separated globs to stage — must cover every layer's locale dir
    I18N_MEMORY_FILE: ".i18n-kit.lock.json"  # the translation memory the CLI writes at the project root, staged with the translations
    I18N_COMMIT_MESSAGE: ""   # replaces the generated commit message
    I18N_PUSH_TOKEN: ""       # access token to push with instead of the job token; with the api
                              # scope it also refreshes the MR pipeline after the push
  script:
    - |
      set -eu

      [ -n "${I18N_PROVIDER:-}" ] && [ -n "${I18N_MODEL:-}" ] && [ -n "${I18N_API_KEY:-}" ] \
        || { echo "ERROR: I18N_PROVIDER, I18N_MODEL and I18N_API_KEY are required."; exit 1; }

      # The CLI reads the env var of the provider it was asked for, so all three
      # carry the same value and only one of them is ever used.
      export OPENAI_API_KEY="$I18N_API_KEY" ANTHROPIC_API_KEY="$I18N_API_KEY" GEMINI_API_KEY="$I18N_API_KEY"

      args="--provider $I18N_PROVIDER --model $I18N_MODEL --batch-size $I18N_BATCH_SIZE"
      [ -n "$I18N_LAYER" ]         && args="$args --layer $I18N_LAYER"
      [ -n "$I18N_LOCALES" ]       && args="$args --targetLocales $I18N_LOCALES"
      [ -n "$I18N_SOURCE_LOCALE" ] && args="$args --referenceLocale $I18N_SOURCE_LOCALE"
      [ -n "$I18N_KEYS" ]          && args="$args --keys $I18N_KEYS"
      [ "$I18N_DRY_RUN" = "true" ] && args="$args --dry-run"
      [ "$I18N_FAIL_ON_FAILED" = "true" ] && args="$args --fail-on-failed"

      # The CLI owns the pass/fail decision and reports it as an exit code: 0
      # success, 1 the run itself failed, 2 a requested gate tripped. Redirect
      # rather than pipe — PIPESTATUS is bash-only.
      mkdir -p .i18n-reports
      set +e
      the-i18n-cli translate $args > .i18n-reports/translate.json
      STATUS=$?
      set -e
      cat .i18n-reports/translate.json

      if [ "$STATUS" != "0" ] && [ "$STATUS" != "2" ]; then echo "ERROR: translate failed (exit ${STATUS}) — check I18N_PROVIDER, I18N_MODEL and I18N_API_KEY."; exit "$STATUS"; fi

      # A tripped gate is carried past the commit: exiting here would report the
      # translations the run did produce as red AND throw them away.
      if [ "$I18N_DRY_RUN" = "true" ]; then echo "Dry run complete. No files written."; exit "$STATUS"; fi
      # The translation memory belongs to the commit that produced it. It
      # records the source text each target was translated from, so the next
      # run can tell a target still made from the current source from one whose
      # source has changed since — and a run whose workspace is thrown away
      # leaves the next one with no memory at all. Absent when translationMemory
      # is off and skipped when the project ignores it; neither is an error.
      STAGE="$I18N_LOCALE_PATHS"
      if [ -f "$I18N_MEMORY_FILE" ] && ! git check-ignore -q "$I18N_MEMORY_FILE"; then STAGE="$STAGE $I18N_MEMORY_FILE"; fi

      if git diff --quiet -- $STAGE && git diff --cached --quiet -- $STAGE; then echo "No translation changes to commit."; exit "$STATUS"; fi

      git config user.name "${GITLAB_USER_NAME:-i18n CI}"
      git config user.email "${GITLAB_USER_EMAIL:-ci@the-i18n-kit.dev}"
      git add -- $STAGE
      git commit -m "${I18N_COMMIT_MESSAGE:-i18n: auto-translate missing keys (${I18N_LAYER:-all layers}) via $I18N_PROVIDER}"

      PUSH_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      [ -z "$I18N_PUSH_TOKEN" ] || PUSH_URL="https://oauth2:${I18N_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push "$PUSH_URL" "HEAD:${CI_COMMIT_REF_NAME}" || {
        echo "ERROR: git push failed. Allow it under Settings → CI/CD → Job token permissions, or set I18N_PUSH_TOKEN to a token with the write_repository scope."; exit 1
      }
      echo "Pushed to ${CI_COMMIT_REF_NAME}"

      # A CI-token push never starts a pipeline, so the new MR head has none and
      # the report widgets have nothing to read. An api-scoped token creates one.
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ] && [ -n "$I18N_PUSH_TOKEN" ]; then
        curl --fail-with-body -sS -X POST -H "PRIVATE-TOKEN: $I18N_PUSH_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/pipelines" \
          || echo "WARN: could not trigger a follow-up MR pipeline — does I18N_PUSH_TOKEN have the api scope?"
      fi

      exit "$STATUS"
  artifacts:
    paths:
      - .i18n-reports/translate.json
    expire_in: 7 days
    when: always

# ─── Report findings, one command per extending job ─────────────────────────
.i18n-scan:
  extends: .i18n-base
  # Findings (exit 2) stay a yellow warning that still reaches the merge request
  # widget, a scan that fell over fails red. `allow_failure: false` on the
  # extending job makes findings block the merge instead.
  allow_failure:
    exit_codes:
      - 2
  variables:
    I18N_COMMAND: ""               # set by the two jobs below
    I18N_LAYER: ""                 # layer to scan (empty = all layers), e.g. root, common
    I18N_FAIL_ON_ORPHANS: "false"  # "true" → exit 2 when orphans are found (.i18n-cleanup only)
  script:
    - |
      set -eu

      # `orphans` only reports; deleting takes an explicit --remove.
      # --codequality-output feeds the merge request widget, --output-file keeps
      # the full report as an artifact and leaves a summary in the log.
      args="--codequality-output gl-codequality.json --output-file .i18n-reports/${I18N_COMMAND}.json"
      [ -n "$I18N_LAYER" ] && args="$args --layer $I18N_LAYER"
      [ "$I18N_FAIL_ON_ORPHANS" = "true" ] && args="$args --fail-on-orphans"

      the-i18n-cli "$I18N_COMMAND" $args
  artifacts:
    paths:
      - .i18n-reports/
      - gl-codequality.json
    reports:
      codequality: gl-codequality.json
    expire_in: 7 days
    when: always

# Orphan keys: reported, never deleted.
.i18n-cleanup:
  extends: .i18n-scan
  variables:
    I18N_COMMAND: "orphans"

# Used-but-undefined keys. Its gate is always evaluated: a key that renders raw
# in production is a defect, not a threshold, so there is nothing to opt into.
.i18n-check:
  extends: .i18n-scan
  variables:
    I18N_COMMAND: "check"
