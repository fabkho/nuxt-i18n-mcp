name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      cli_release_created: ${{ steps.release.outputs['packages/cli--release_created'] }}
      mcp_release_created: ${{ steps.release.outputs['packages/mcp--release_created'] }}
      nuxt_release_created: ${{ steps.release.outputs['packages/nuxt--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    # Always run on workflow_dispatch; on push only when release-please created a release.
    # `always()` is needed because `needs.release-please` is skipped on dispatch.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Idempotent version check: publish only when this exact version is not
      # on the registry yet. Lets the same job recover from a failed publish
      # (e.g. expired token) without needing a fresh release-please cycle —
      # just re-run via workflow_dispatch.
      #
      # Asks for the exact version rather than the latest dist-tag, so a moved
      # tag cannot make a published version look missing. A registry error that
      # is not "no such version" fails the job instead of being read as absent:
      # guessing "not published" on a network or auth blip would send us into a
      # publish that can only fail confusingly.
      - name: Compute publish targets
        id: targets
        run: |
          set -euo pipefail
          # Each entry is <output key>:<package dir>:<name>.
          targets="cli:cli:@the-i18n-kit/cli mcp:mcp:@the-i18n-kit/mcp nuxt:nuxt:@the-i18n-kit/nuxt"
          targets="$targets eslint_plugin_vue:eslint-plugin-vue:@the-i18n-kit/eslint-plugin-vue"
          targets="$targets mcp_compat:mcp-compat:the-i18n-mcp"

          for target in $targets; do
            pkg=${target%%:*}
            rest=${target#*:}
            dir=${rest%%:*}
            name=${rest#*:}
            local_ver=$(jq -r .version "packages/$dir/package.json")

            set +e
            found=$(npm view "$name@$local_ver" version 2>/tmp/npm-view.err)
            status=$?
            set -e

            # Verified against the live registry: a published version exits 0
            # with the version echoed, while both an unpublished version of a
            # known package and a wholly unknown package exit non-zero with E404.
            if [ "$status" -eq 0 ] && [ -n "$found" ]; then
              echo "$pkg=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping $name@$local_ver (already on registry)"
            elif grep -q 'E404' /tmp/npm-view.err; then
              echo "$pkg=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Will publish $name@$local_ver (not on registry)"
            else
              cat /tmp/npm-view.err
              echo "::error::Could not determine registry state for $name@$local_ver"
              exit 1
            fi
          done

      # Scoped, so --access public is load-bearing rather than a formality:
      # without it npm defaults @the-i18n-kit/* to restricted. The CLI goes
      # first: the MCP package depends on it and must never point at a version
      # that is not on the registry yet.
      - name: Publish @the-i18n-kit/cli
        if: ${{ steps.targets.outputs.cli == 'true' }}
        run: pnpm --filter @the-i18n-kit/cli publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # CI consumers pin `uses: fabkho/the-i18n-kit@v7` and the GitLab include at
      # `.../v7/gitlab-ci.yml`. The ref follows the CLI major, so a template
      # change reaches them together with the CLI release it was written for,
      # never ahead of it.
      - name: Move the v<major> ref to this release
        if: ${{ steps.targets.outputs.cli == 'true' }}
        run: |
          major="v$(jq -r .version packages/cli/package.json | cut -d. -f1)"
          git tag -f "$major"
          git push -f origin "$major"

      - name: Publish @the-i18n-kit/mcp
        if: ${{ steps.targets.outputs.mcp == 'true' }}
        run: pnpm --filter @the-i18n-kit/mcp publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The pre-rename alias. Published after the real package so `npx
      # the-i18n-mcp@latest` never resolves to a version whose dependency is
      # not on the registry yet.
      - name: Publish the-i18n-mcp (alias)
        if: ${{ steps.targets.outputs.mcp_compat == 'true' }}
        run: pnpm --filter the-i18n-mcp publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @the-i18n-kit/nuxt
        if: ${{ steps.targets.outputs.nuxt == 'true' }}
        run: pnpm --filter @the-i18n-kit/nuxt publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @the-i18n-kit/eslint-plugin-vue
        if: ${{ steps.targets.outputs.eslint_plugin_vue == 'true' }}
        run: pnpm --filter @the-i18n-kit/eslint-plugin-vue publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
